# =====================================================
# CONFIGURACION GENERAL
# =====================================================
spring.application.name=ErpPolicalum
server.address=0.0.0.0
server.port=${PORT:8080}

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

# =====================================================
# DATABASE - POSTGRESQL
# =====================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.main.allow-circular-references=true

spring.main.lazy-initialization=true
# =====================================================
# HIBERNATE / JPA
# =====================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# =====================================================
# CORS, JWT, TOTP Y ARCHIVOS
# =====================================================
app.cors.allowed-origins=${APP_CORS_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:28800000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600000}
totp.secret-key-publico=${TOTP_PUBLIC_SECRET}
app.uploads.base-path=${UPLOADS_BASE_PATH:./uploads}

# =====================================================
# RATE LIMITING & SWAGGER
# =====================================================
app.rate-limit.login.capacity=${RATE_LIMIT_LOGIN_CAPACITY:10}
app.rate-limit.login.window-seconds=${RATE_LIMIT_LOGIN_WINDOW:60}
app.rate-limit.qr-publico.capacity=${RATE_LIMIT_QR_CAPACITY:30}
app.rate-limit.qr-publico.window-seconds=${RATE_LIMIT_QR_WINDOW:60}
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.seed.enabled=${APP_SEED_ENABLED:false}
